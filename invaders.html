<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rock Invaders</title>
    <style>
        /* リセットと基本設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #050814; /* ダークネイビー */
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none; /* デフォルトのタッチ動作を無効化 */
        }
        
        /* ゲームコンテナ：16:9の比率を保ちつつ画面にフィット */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: linear-gradient(180deg, #050814 0%, #1a153a 100%);
        }

        #gameCanvas {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            aspect-ratio: 9 / 16;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
        }

        /* UIオーバーレイ */
        #ui-layer {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            max-width: calc(100vh * (9/16)); /* キャンバスの幅に合わせる */
            pointer-events: none; /* UIクリックを透過 */
        }

        /* 画面状態（スタート、ゲームオーバー等） */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(5, 8, 20, 0.85);
            color: #fff;
            z-index: 10;
            text-align: center;
            pointer-events: auto;
        }
        .screen h1 {
            font-size: 8vw;
            color: #f4d03f;
            text-shadow: 0 0 10px #f4d03f;
            margin-bottom: 20px;
        }
        @media (min-width: 768px) {
            .screen h1 { font-size: 3rem; }
        }
        .screen p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #00ffff;
        }
        .btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #050814;
            background-color: #00ffff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px #00ffff;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 5px #00ffff;
        }

        /* スマホ用コントロール（画面下部） */
        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            max-width: calc(100vh * (9/16));
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
            z-index: 5;
        }
        .control-group {
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 255, 0.5);
            color: rgba(0, 255, 255, 0.8);
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .ctrl-btn:active {
            background: rgba(0, 255, 255, 0.3);
        }

        /* PC等、タッチ不要な場合はコントロールを隠す */
        @media (hover: hover) and (pointer: fine) {
            #controls { display: none; }
        }
        
        #hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 内部解像度を1080x1920に固定し、CSSでスケール -->
    <canvas id="gameCanvas" width="1080" height="1920"></canvas>
    
    <div id="ui-layer">
        <!-- 仮想パッド (スマホ向け) -->
        <div id="controls">
            <div class="control-group">
                <div class="ctrl-btn" id="btn-left">◀</div>
                <div class="ctrl-btn" id="btn-right">▶</div>
            </div>
            <div class="control-group">
                <div class="ctrl-btn" id="btn-shoot">♪</div>
            </div>
        </div>
    </div>

    <!-- スタート画面 -->
    <div id="start-screen" class="screen">
        <h1>ROCK<br>INVADERS</h1>
        <p>LET'S ROCK, OTOFU!</p>
        <p style="font-size: 1rem; color: #ccc; margin-bottom:40px;">
            PC: [←][→] or [A][D] to Move, [Space] to Shoot<br>
            Mobile: Touch Buttons or Drag & Tap
        </p>
        <button class="btn" id="start-btn">PLAY</button>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="gameover-screen" class="screen" style="display: none;">
        <h1 style="color: #ff0055; text-shadow: 0 0 10px #ff0055;">GAME OVER</h1>
        <p id="final-score">SCORE: 0</p>
        <button class="btn" id="restart-btn">RETRY</button>
    </div>

    <!-- クリア画面 -->
    <div id="clear-screen" class="screen" style="display: none;">
        <h1 style="color: #39ff14; text-shadow: 0 0 10px #39ff14;">STAGE CLEAR!</h1>
        <p id="clear-score">SCORE: 0</p>
        <button class="btn" id="next-btn">PLAY AGAIN</button>
    </div>
</div>

<script>
/**
 * サウンドマネージャー (Web Audio API)
 * ピロリン（ギター風単音）やジャーン（コード音）を生成
 */
class SoundManager {
    constructor() {
        this.ctx = null;
        this.initialized = false;
    }

    init() {
        if (!this.initialized) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
            this.initialized = true;
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    // ギターのピッキング風ショット音
    playShoot() {
        if (!this.initialized) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        
        // 三角波で柔らかいギター風の音
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(659.25, this.ctx.currentTime); // E5
        osc.frequency.exponentialRampToValueAtTime(329.63, this.ctx.currentTime + 0.1); // E4に落ちる
        
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
    }

    // 敵撃破時のコード音（ジャーン）
    playExplosion() {
        if (!this.initialized) return;
        // Eメジャーコード等の構成音
        const freqs = [329.63, 415.30, 493.88]; 
        freqs.forEach(f => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth'; // 少し歪んだロックな音
            osc.frequency.setValueAtTime(f, this.ctx.currentTime);
            
            gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
        });
    }
    
    // ダメージ音（不協和音）
    playDamage() {
        if (!this.initialized) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
    }
}

const sound = new SoundManager();

/**
 * ゲーム全体を管理するクラス
 */
class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        // 論理サイズ (9:16)
        this.width = 1080;
        this.height = 1920;
        
        this.state = 'start'; // start, playing, gameover, clear
        this.score = 0;
        
        // 入力状態
        this.keys = { left: false, right: false, shoot: false };
        this.touchX = null;
        
        // エンティティ
        this.player = null;
        this.bullets = [];
        this.enemies = [];
        this.enemyBullets = [];
        this.bunkers = [];
        this.particles = [];
        this.ufo = null;
        
        this.enemyDirection = 1; // 1:右, -1:左
        this.enemySpeed = 2;
        this.enemyStepDown = false;
        
        this.frameCount = 0;
        
        this.setupInputs();
        
        // アニメーションループのバインド
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    }

    setupInputs() {
        // PCキーボード
        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') this.keys.left = true;
            if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') this.keys.right = true;
            if(e.key === ' ' && this.state === 'playing') {
                if(!this.keys.shoot) this.playerShoot();
                this.keys.shoot = true;
            }
        });
        window.addEventListener('keyup', (e) => {
            if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') this.keys.left = false;
            if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') this.keys.right = false;
            if(e.key === ' ') this.keys.shoot = false;
        });

        // スマホ仮想ボタン
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnShoot = document.getElementById('btn-shoot');
        
        const bindTouch = (el, key, action) => {
            el.addEventListener('touchstart', (e) => {
                e.preventDefault();
                this.keys[key] = true;
                if(action && this.state === 'playing') action();
            });
            el.addEventListener('touchend', (e) => {
                e.preventDefault();
                this.keys[key] = false;
            });
        };
        bindTouch(btnLeft, 'left');
        bindTouch(btnRight, 'right');
        bindTouch(btnShoot, 'shoot', () => this.playerShoot());

        // キャンバス上のドラッグ＆タップ（直感操作）
        this.canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if(this.state !== 'playing') return;
            const rect = this.canvas.getBoundingClientRect();
            const touch = e.touches[0];
            // 画面上のX座標をキャンバス内の論理座標に変換
            const scaleX = this.width / rect.width;
            this.touchX = (touch.clientX - rect.left) * scaleX;
        }, {passive: false});
        
        this.canvas.addEventListener('touchstart', (e) => {
            if(this.state !== 'playing' || e.target.closest('#controls')) return;
            this.playerShoot();
            const rect = this.canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const scaleX = this.width / rect.width;
            this.touchX = (touch.clientX - rect.left) * scaleX;
        }, {passive: false});
        
        this.canvas.addEventListener('touchend', () => {
            this.touchX = null;
        });
    }

    start() {
        sound.init();
        this.score = 0;
        this.frameCount = 0;
        this.state = 'playing';
        
        this.bullets = [];
        this.enemyBullets = [];
        this.particles = [];
        this.ufo = null;
        
        // 自機の初期化 (画面中央下)
        this.player = new Player(this.width / 2, this.height - 150);
        
        // 敵の初期化 (縦5行 x 横8列)
        this.enemies = [];
        this.enemyDirection = 1;
        this.enemySpeed = 2;
        const rows = 5;
        const cols = 8;
        const spacingX = 90;
        const spacingY = 90;
        const startX = (this.width - (cols * spacingX)) / 2 + 45;
        const startY = 250;
        
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                // 行によって色を変える
                let color = r < 1 ? '#ff00ff' : r < 3 ? '#39ff14' : '#00ffff';
                this.enemies.push(new Enemy(startX + c * spacingX, startY + r * spacingY, color));
            }
        }
        
        // トーチカ（アンプ）の初期化 (4基)
        this.bunkers = [];
        const bunkerCount = 4;
        const bSpacing = this.width / (bunkerCount + 1);
        for(let i=1; i<=bunkerCount; i++) {
            this.bunkers.push(new Bunker(i * bSpacing, this.height - 400));
        }

        // UI切り替え
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('gameover-screen').style.display = 'none';
        document.getElementById('clear-screen').style.display = 'none';
    }

    playerShoot() {
        if (!this.player || this.player.isDead) return;
        // 最大2発まで
        if (this.bullets.length < 2) {
            // ギターのヘッドあたり(自機の少し右斜め上)から発射
            this.bullets.push(new Bullet(this.player.x + 30, this.player.y - 120));
            this.player.strum(); // ストロークアニメーション
            sound.playShoot();
        }
    }

    createParticles(x, y, color) {
        for(let i=0; i<8; i++) {
            this.particles.push(new Particle(x, y, color));
        }
    }

    update() {
        if (this.state !== 'playing') return;
        this.frameCount++;

        // ---------------- Player Update ----------------
        if (!this.player.isDead) {
            if (this.touchX !== null) {
                // タッチ追従（少し滑らかに）
                this.player.x += (this.touchX - this.player.x) * 0.2;
            } else {
                if (this.keys.left) this.player.x -= this.player.speed;
                if (this.keys.right) this.player.x += this.player.speed;
            }
            // 画面端の制限
            this.player.x = Math.max(80, Math.min(this.width - 80, this.player.x));
            this.player.update();
        } else {
            this.player.update();
            if (this.player.respawnTimer <= 0 && this.player.lives > 0) {
                this.player.respawn();
            } else if (this.player.lives <= 0) {
                this.state = 'gameover';
                document.getElementById('final-score').innerText = 'SCORE: ' + this.score;
                document.getElementById('gameover-screen').style.display = 'flex';
                return;
            }
        }

        // ---------------- UFO (ボーナスレコード) ----------------
        if (!this.ufo && Math.random() < 0.001) { // 約0.1%の確率で出現
            this.ufo = new UFO(this.width);
        }
        if (this.ufo) {
            this.ufo.update();
            if (this.ufo.x > this.width + 100 || this.ufo.x < -100) this.ufo = null;
        }

        // ---------------- Bullets (自機弾) ----------------
        for (let i = this.bullets.length - 1; i >= 0; i--) {
            let b = this.bullets[i];
            b.update();
            if (b.y < 0) {
                this.bullets.splice(i, 1);
                continue;
            }

            // UFO判定
            if (this.ufo && this.checkCollision(b, this.ufo)) {
                sound.playExplosion();
                this.createParticles(this.ufo.x, this.ufo.y, '#f4d03f');
                this.score += 300;
                this.ufo = null;
                this.bullets.splice(i, 1);
                continue;
            }

            // 敵判定
            let hit = false;
            for (let j = this.enemies.length - 1; j >= 0; j--) {
                let e = this.enemies[j];
                if (this.checkCollision(b, e)) {
                    sound.playExplosion();
                    this.createParticles(e.x, e.y, e.color);
                    this.score += (e.color === '#ff00ff' ? 30 : e.color === '#39ff14' ? 20 : 10);
                    this.enemies.splice(j, 1);
                    this.bullets.splice(i, 1);
                    hit = true;
                    // 敵が減るとスピードアップ
                    this.enemySpeed += 0.05; 
                    break;
                }
            }
            if (hit) continue;

            // トーチカ判定
            for (let k = 0; k < this.bunkers.length; k++) {
                if (this.bunkers[k].checkHit(b)) {
                    this.bullets.splice(i, 1);
                    break;
                }
            }
        }

        // クリア判定
        if (this.enemies.length === 0) {
            this.state = 'clear';
            document.getElementById('clear-score').innerText = 'FINAL SCORE: ' + this.score;
            document.getElementById('clear-screen').style.display = 'flex';
            return;
        }

        // ---------------- Enemies Update ----------------
        let edgeReached = false;
        let lowestEnemyY = 0;
        
        for (let e of this.enemies) {
            e.x += this.enemySpeed * this.enemyDirection;
            if (e.x > this.width - 50 || e.x < 50) {
                edgeReached = true;
            }
            if (e.y > lowestEnemyY) lowestEnemyY = e.y;
            
            // 敵の発砲（ノイズ弾）
            if (Math.random() < 0.001 + (this.frameCount * 0.000001)) {
                this.enemyBullets.push(new EnemyBullet(e.x, e.y + 30));
            }
        }
        
        if (edgeReached) {
            this.enemyDirection *= -1;
            for (let e of this.enemies) {
                e.y += 40;
                e.x += this.enemySpeed * this.enemyDirection; // 端に引っかからないように
            }
        }
        
        // 敵が下まで来たらゲームオーバー
        if (lowestEnemyY > this.player.y - 100) {
            this.player.lives = 0;
            this.player.isDead = true;
        }

        // ---------------- Enemy Bullets (敵弾) ----------------
        for (let i = this.enemyBullets.length - 1; i >= 0; i--) {
            let eb = this.enemyBullets[i];
            eb.update();
            if (eb.y > this.height) {
                this.enemyBullets.splice(i, 1);
                continue;
            }
            
            // トーチカ判定
            let hitBunker = false;
            for (let k = 0; k < this.bunkers.length; k++) {
                if (this.bunkers[k].checkHit(eb)) {
                    this.enemyBullets.splice(i, 1);
                    hitBunker = true;
                    break;
                }
            }
            if (hitBunker) continue;

            // プレイヤー判定
            if (!this.player.isDead && this.player.invincibleTimer <= 0) {
                // プレイヤーの当たり判定は少し小さくする（中心付近）
                let hitbox = { x: this.player.x, y: this.player.y - 50, width: 60, height: 100 };
                if (this.checkCollision(eb, hitbox, true)) {
                    sound.playDamage();
                    this.createParticles(this.player.x, this.player.y - 50, '#ffccaa');
                    this.player.die();
                    this.enemyBullets.splice(i, 1);
                }
            }
        }

        // ---------------- Particles ----------------
        for (let i = this.particles.length - 1; i >= 0; i--) {
            this.particles[i].update();
            if (this.particles[i].life <= 0) {
                this.particles.splice(i, 1);
            }
        }
    }

    checkCollision(obj1, obj2, isObj2Hitbox = false) {
        let w1 = obj1.width || obj1.r * 2 || 20;
        let h1 = obj1.height || obj1.r * 2 || 20;
        let x1 = obj1.x - w1/2;
        let y1 = obj1.y - h1/2;

        let w2 = isObj2Hitbox ? obj2.width : (obj2.width || obj2.r * 2 || 60);
        let h2 = isObj2Hitbox ? obj2.height : (obj2.height || obj2.r * 2 || 60);
        let x2 = isObj2Hitbox ? obj2.x - w2/2 : obj2.x - w2/2;
        let y2 = isObj2Hitbox ? obj2.y - h2/2 : obj2.y - h2/2;

        return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && h1 + y1 > y2;
    }

    draw() {
        // 背景クリア
        this.ctx.clearRect(0, 0, this.width, this.height);

        // ※ここでスタート画面時は描画処理をスキップするように修正（エラー防止）
        if (this.state === 'start') return;

        // UI描画 (スコア)
        this.ctx.fillStyle = '#00ffff';
        this.ctx.font = 'bold 40px Courier New';
        this.ctx.textAlign = 'left';
        this.ctx.fillText('SCORE: ' + this.score, 30, 60);

        // UI描画 (残機 - ギターのピック風)
        if (this.player) {
            this.ctx.textAlign = 'right';
            this.ctx.fillText('LIVES: ', this.width - 150, 60);
            for(let i=0; i<this.player.lives; i++) {
                this.drawPick(this.width - 120 + (i * 40), 45, 30);
            }
        }

        if (this.ufo) this.ufo.draw(this.ctx);
        for (let b of this.bunkers) b.draw(this.ctx);
        for (let e of this.enemies) e.draw(this.ctx);
        for (let b of this.bullets) b.draw(this.ctx);
        for (let eb of this.enemyBullets) eb.draw(this.ctx);
        for (let p of this.particles) p.draw(this.ctx);
        
        if ((this.state === 'playing' || this.state === 'gameover') && this.player) {
            this.player.draw(this.ctx);
        }
    }

    drawPick(x, y, size) {
        this.ctx.fillStyle = '#f4d03f'; // イエロートータス風
        this.ctx.beginPath();
        this.ctx.moveTo(x, y - size/2);
        this.ctx.quadraticCurveTo(x + size/2, y - size/2, x + size/2, y);
        this.ctx.quadraticCurveTo(x, y + size/2, x, y + size/2);
        this.ctx.quadraticCurveTo(x - size/2, y, x - size/2, y);
        this.ctx.quadraticCurveTo(x - size/2, y - size/2, x, y - size/2);
        this.ctx.fill();
    }

    loop() {
        this.update();
        this.draw();
        requestAnimationFrame(this.loop);
    }
}

/**
 * ギタリスト（自機）
 */
class Player {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.speed = 8;
        this.lives = 3;
        this.isDead = false;
        
        // アニメーション・状態管理
        this.strumTimer = 0;
        this.invincibleTimer = 0;
        this.respawnTimer = 0;
        
        // 描画サイズ基準
        this.w = 120;
        this.h = 240;
    }
    
    strum() {
        this.strumTimer = 15; // ストロークアニメーションのフレーム数
    }

    die() {
        this.lives--;
        this.isDead = true;
        this.respawnTimer = 60;
    }

    respawn() {
        this.isDead = false;
        this.x = 1080 / 2; // 中央に戻る
        this.invincibleTimer = 120; // 2秒無敵
    }

    update() {
        if (this.strumTimer > 0) this.strumTimer--;
        if (this.invincibleTimer > 0) this.invincibleTimer--;
        if (this.respawnTimer > 0) this.respawnTimer--;
    }

    draw(ctx) {
        if (this.isDead) return;
        // 無敵時の点滅
        if (this.invincibleTimer > 0 && Math.floor(Date.now() / 100) % 2 === 0) return;

        const x = this.x;
        const y = this.y;
        const headSize = this.w * 0.25;
        const hy = y - 160 - headSize;
        
        ctx.save();
        
        // --- 足 (ネイビーのパンツ) ---
        ctx.fillStyle = '#1c2841'; // ネイビー
        ctx.fillRect(x - 25, y - 60, 20, 60); // 左足
        ctx.fillRect(x + 5, y - 60, 20, 60);  // 右足

        // --- 体 (白Tシャツ) ---
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(x - 35, y - 160, 70, 100, 10);
        ctx.fill();

        // --- 頭 (肌色) ---
        ctx.fillStyle = '#ffccaa';
        ctx.beginPath();
        ctx.arc(x, hy, headSize, 0, Math.PI*2);
        ctx.fill();

        // --- 髪の毛 (少し茶色がかった黒) ---
        ctx.fillStyle = '#2a1b16'; 
        ctx.beginPath();
        // 頭の周り（少し大きめの半円）
        ctx.arc(x, hy - 2, headSize + 3, Math.PI * 0.8, Math.PI * 2.2);
        // 右もみあげ
        ctx.lineTo(x + headSize + 2, hy + 12);
        // 前髪（無造作なギザギザ）
        ctx.lineTo(x + 15, hy - 12);
        ctx.lineTo(x + 5, hy - 5);
        ctx.lineTo(x - 10, hy - 15);
        ctx.lineTo(x - 20, hy - 8);
        // 左もみあげ
        ctx.lineTo(x - headSize - 2, hy + 12);
        ctx.fill();

        // --- 黒縁メガネ ---
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 4;
        const ey = hy - 5;
        // 左レンズ
        ctx.strokeRect(x - 22, ey, 18, 14);
        // 右レンズ
        ctx.strokeRect(x + 4, ey, 18, 14);
        // ブリッジ
        ctx.beginPath();
        ctx.moveTo(x - 4, ey + 7);
        ctx.lineTo(x + 4, ey + 7);
        ctx.stroke();

        // --- テレキャスター（ギター） ---
        ctx.save();
        // ギターの位置と角度
        ctx.translate(x + 10, y - 100);
        
        // ストローク時のギターの動き（少し跳ね上げる）
        if (this.strumTimer > 0) {
            ctx.rotate(-Math.PI / 8); 
            ctx.translate(0, -10);
        } else {
            ctx.rotate(-Math.PI / 12); 
        }

        // ネック (茶色)
        ctx.fillStyle = '#8b4513';
        ctx.fillRect(-60, -8, 120, 16);
        // ヘッド
        ctx.fillStyle = '#d2b48c';
        ctx.fillRect(-80, -12, 20, 24);

        // ボディ (ブロンド/イエロー)
        ctx.fillStyle = '#f4d03f';
        ctx.beginPath();
        ctx.roundRect(10, -35, 60, 70, 15);
        ctx.fill();
        // ピックガード (白)
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(30, -5, 20, 0, Math.PI*2);
        ctx.fill();
        
        ctx.restore(); // ギターのtransform解除

        // --- 右腕 (ストロークする腕) ---
        ctx.strokeStyle = '#ffccaa';
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x + 35, y - 140); // 肩
        
        if (this.strumTimer > 0) {
            // ジャカッと弾いた下ろした腕
            ctx.lineTo(x + 50, y - 90);
        } else {
            // 構えている腕
            ctx.lineTo(x + 30, y - 110);
        }
        ctx.stroke();

        ctx.restore();
    }
}

/**
 * 敵（インベーダー風）
 */
class Enemy {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.width = 60;
        this.height = 60;
        this.color = color;
        this.frame = 0;
    }
    
    draw(ctx) {
        this.frame += 0.05;
        const isAnim = Math.floor(this.frame) % 2 === 0;
        
        ctx.fillStyle = this.color;
        // ピクセルアート風の矩形の組み合わせでインベーダーを描く
        const s = 6; // 1ピクセルのサイズ
        const cx = this.x - (s * 11)/2;
        const cy = this.y - (s * 8)/2;
        
        // 簡易的な8ビット風パターン (11x8)
        let pattern;
        if (isAnim) {
            pattern = [
                "  #     #  ",
                "   #   #   ",
                "  #######  ",
                " ## ### ## ",
                "###########",
                "# ####### #",
                "# #     # #",
                "   ## ##   "
            ];
        } else {
            pattern = [
                "  #     #  ",
                "#  #   #  #",
                "# ####### #",
                "### ### ###",
                "###########",
                " ####### ",
                "  #   #  ",
                " #     # "
            ];
        }
        
        for (let row = 0; row < pattern.length; row++) {
            for (let col = 0; col < pattern[row].length; col++) {
                if (pattern[row][col] === '#') {
                    ctx.fillRect(cx + col * s, cy + row * s, s, s);
                }
            }
        }
        
        // 光る効果
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowBlur = 0; // 他への影響リセット
    }
}

/**
 * ボーナス敵（空飛ぶレコード）
 */
class UFO {
    constructor(screenWidth) {
        this.direction = Math.random() > 0.5 ? 1 : -1;
        this.x = this.direction === 1 ? -50 : screenWidth + 50;
        this.y = 100;
        this.width = 90;
        this.height = 40;
        this.speed = 4 * this.direction;
    }
    update() {
        this.x += this.speed;
    }
    draw(ctx) {
        // レコードを斜めから見たような楕円
        ctx.save();
        ctx.translate(this.x, this.y);
        
        // 黒い盤面
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.ellipse(0, 0, 45, 20, 0, 0, Math.PI*2);
        ctx.fill();
        
        // 赤いラベル
        ctx.fillStyle = '#d32f2f';
        ctx.beginPath();
        ctx.ellipse(0, 0, 15, 6, 0, 0, Math.PI*2);
        ctx.fill();
        
        // 中心穴
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(0, 0, 3, 1, 0, 0, Math.PI*2);
        ctx.fill();
        
        ctx.restore();
    }
}

/**
 * 自機の弾（音符）
 */
class Bullet {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.speed = 15;
        this.width = 30;
        this.height = 30;
        this.isDouble = Math.random() > 0.5; // ♪ か ♫ か
    }
    update() {
        this.y -= this.speed;
    }
    draw(ctx) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 40px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // 光彩エフェクト
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = 10;
        ctx.fillText(this.isDouble ? '♫' : '♪', this.x, this.y);
        ctx.shadowBlur = 0;
    }
}

/**
 * 敵の弾（ノイズ・不協和音の波紋）
 */
class EnemyBullet {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.speed = 8;
        this.width = 15;
        this.height = 30;
        this.frame = 0;
    }
    update() {
        this.y += this.speed;
        this.frame++;
    }
    draw(ctx) {
        ctx.strokeStyle = '#ff0055';
        ctx.lineWidth = 3;
        ctx.beginPath();
        // ギザギザの波形を描く
        ctx.moveTo(this.x, this.y - 15);
        ctx.lineTo(this.x + (this.frame%10 < 5 ? 10 : -10), this.y);
        ctx.lineTo(this.x, this.y + 15);
        ctx.stroke();
    }
}

/**
 * トーチカ（アンプ）
 */
class Bunker {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 140;
        this.height = 100;
        // アンプを小さなブロックの集合体として管理（破壊表現のため）
        this.blocks = [];
        const bw = 10;
        const bh = 10;
        for (let by = 0; by < this.height; by += bh) {
            for (let bx = 0; bx < this.width; bx += bw) {
                // アンプの形状（上部が少しアーチ状など、今回はシンプルに四角）
                this.blocks.push({
                    x: bx - this.width/2,
                    y: by - this.height/2,
                    w: bw,
                    h: bh,
                    active: true
                });
            }
        }
    }

    checkHit(bullet) {
        let hit = false;
        let bx = bullet.x;
        let by = bullet.y;
        let bw = bullet.width || 10;
        
        for (let b of this.blocks) {
            if (b.active) {
                let absX = this.x + b.x;
                let absY = this.y + b.y;
                // 当たり判定
                if (bx > absX && bx < absX + b.w && by > absY && by < absY + b.h) {
                    b.active = false;
                    hit = true;
                }
            }
        }
        if (hit) {
            // 爆発で周囲のブロックも少し壊れる
            this.explodeArea(bullet.x, bullet.y, 25);
        }
        return hit;
    }

    explodeArea(cx, cy, radius) {
        for (let b of this.blocks) {
            if (b.active) {
                let absX = this.x + b.x + b.w/2;
                let absY = this.y + b.y + b.h/2;
                let dist = Math.hypot(absX - cx, absY - cy);
                if (dist < radius && Math.random() > 0.3) {
                    b.active = false;
                }
            }
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        
        // 外枠を描画（ベース）
        ctx.fillStyle = '#222';
        ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
        
        // 破壊されていないブロックを描画（スピーカーメッシュ風）
        ctx.fillStyle = '#666';
        for (let b of this.blocks) {
            if (b.active) {
                // メッシュっぽく少し隙間を空ける
                ctx.fillRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
            } else {
                // 壊れた部分は背景色
                ctx.fillStyle = '#050814';
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.fillStyle = '#666'; // 色を戻す
            }
        }
        
        // アンプのコントロールノブなどの装飾（上部）
        ctx.fillStyle = '#bbb';
        ctx.fillRect(-this.width/2 + 5, -this.height/2 + 5, this.width - 10, 15);
        
        ctx.restore();
    }
}

/**
 * ヒット時のパーティクル（音楽記号や星）
 */
class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = Math.random() * 0.03 + 0.02;
        
        // パーティクルの種類
        const types = ['★', '♯', '♭', 'circle'];
        this.type = types[Math.floor(Math.random() * types.length)];
        this.size = Math.random() * 20 + 10;
        this.rot = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.2;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.rot += this.rotSpeed;
        this.life -= this.decay;
    }
    draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        
        if (this.type === 'circle') {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(0, 0, this.size/3, 0, Math.PI*2);
            ctx.fill();
        } else {
            ctx.fillStyle = this.color;
            ctx.font = `bold ${this.size}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.type, 0, 0);
        }
        
        ctx.restore();
    }
}
